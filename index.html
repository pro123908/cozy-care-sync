<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wellcare Mart — Medical Supplies & Equipment</title>
    <meta
      name="description"
      content="Shop trusted medical supplies, monitoring devices, and wellness essentials. Free same-day delivery in Karachi on orders above Rs 2,000."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Wellcare Mart — Medical Supplies & Equipment" />
    <meta
      property="og:description"
      content="Shop trusted medical supplies, monitoring devices, and wellness essentials. Free same-day delivery in Karachi on orders above Rs 2,000."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wellcaremart.pk/" />
    <meta property="og:image" content="https://wellcaremart.pk/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wellcare Mart — Medical Supplies & Equipment" />
    <meta
      name="twitter:description"
      content="Shop trusted medical supplies, monitoring devices, and wellness essentials. Free same-day delivery in Karachi on orders above Rs 2,000."
    />
    <meta name="twitter:image" content="https://wellcaremart.pk/og-image.png" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Preloads the actual slot-0 hero images (see GRAND_OPENING_DESKTOP_OVERRIDE /
         GRAND_OPENING_MOBILE_OVERRIDE in products-marketing-components.tsx) so the
         LCP image starts fetching from the initial HTML instead of waiting on the
         Supabase banner fetch + JS render. Revert alongside those together. -->
    <link rel="preload" href="/azadi-banner.webp" as="image" type="image/webp" fetchpriority="high" media="(min-width: 769px)" />
    <link rel="preload" href="/azadi-banner-mobile.webp" as="image" type="image/webp" fetchpriority="high" media="(max-width: 768px)" />
    <link rel="preconnect" href="https://dkspvlpswpipltceptoa.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
